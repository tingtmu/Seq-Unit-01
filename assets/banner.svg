<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-labelledby="title desc">
  <title id="title">NERV · Seq-Unit-01</title>
  <desc id="desc">Episode title card style banner: agent skills for sequencing projects, with the palette Eva Purple, Eva Green, NERV Orange and Alert Red. Unofficial fan homage.</desc>
  <style>
    .card { font-family: 'Times New Roman', Times, Georgia, 'Noto Serif', serif; font-weight: 900; fill: #F2F2F2; }
    .kanji { font-family: 'Yu Mincho', 'Hiragino Mincho ProN', 'Noto Serif CJK JP', 'MS Mincho', serif; font-weight: 900; fill: #F2F2F2; }
    .sub { font-family: Helvetica, Arial, 'Liberation Sans', sans-serif; font-weight: 700; fill: #FF9900; letter-spacing: 1px; }
    .swatch { font-family: Consolas, Menlo, 'DejaVu Sans Mono', monospace; font-size: 15px; fill: #F2F2F2; opacity: 0.85; letter-spacing: 1px; }
    .motto { font-family: 'Times New Roman', Times, Georgia, serif; font-style: italic; font-size: 17px; fill: #F2F2F2; opacity: 0.7; letter-spacing: 1px; }
  </style>

  <rect width="1200" height="380" fill="#0B0A14"/>

  <!-- Name block, compressed like an episode title card -->
  <text class="card" x="60" y="160" font-size="176" textLength="300" lengthAdjust="spacingAndGlyphs">NERV</text>
  <text class="card" x="390" y="160" font-size="148" textLength="640" lengthAdjust="spacingAndGlyphs">SEQ-UNIT-01</text>

  <!-- Vertical accent: Unit-01 -->
  <text class="kanji" x="1110" y="72" font-size="50" text-anchor="middle">初</text>
  <text class="kanji" x="1110" y="126" font-size="50" text-anchor="middle">号</text>
  <text class="kanji" x="1110" y="180" font-size="50" text-anchor="middle">機</text>

  <!-- Subtitle -->
  <text class="card" x="62" y="222" font-size="34" textLength="150" lengthAdjust="spacingAndGlyphs">EPISODE:1</text>
  <text class="sub" x="232" y="221" font-size="27">AGENT SKILLS FOR SEQUENCING PROJECTS</text>

  <!-- Palette strip -->
  <rect x="60" y="252" width="262" height="26" fill="#734F9A"/>
  <rect x="332" y="252" width="262" height="26" fill="#8BD450"/>
  <rect x="604" y="252" width="262" height="26" fill="#FF9900"/>
  <rect x="876" y="252" width="264" height="26" fill="#E52F20"/>
  <text class="swatch" x="60" y="302">EVA PURPLE #734F9A</text>
  <text class="swatch" x="332" y="302">EVA GREEN #8BD450</text>
  <text class="swatch" x="604" y="302">NERV ORANGE #FF9900</text>
  <text class="swatch" x="876" y="302">ALERT RED #E52F20</text>

  <!-- NERV motto (Robert Browning, Pippa Passes) -->
  <text class="motto" x="1140" y="348" text-anchor="end">GOD'S IN HIS HEAVEN. ALL'S RIGHT WITH THE WORLD.</text>
</svg>
