<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 624" width="1200" height="624" role="img" aria-labelledby="title desc">
  <title id="title">Lifecycle of a sequencing project with NERV skills</title>
  <desc id="desc">NERV skills cover two phases: nerv-init sets up the project and takes in the raw data, and yashima-blueprint plans the analysis before any results exist. Analysis (building, running, exploring) and publishing are yours and your agent's, with your own tools and skills. On the analysis loop, magi-review and sync-ratio are the gates, and a deviation goes back to the plan. In every phase, a few hard rules protect raw data, secrets, and reproducibility, and folder READMEs keep your agent oriented.</desc>
